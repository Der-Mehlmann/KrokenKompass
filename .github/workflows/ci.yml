name: CI
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Elm dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('Code/frontend/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Install dependencies
        run: npm ci

      - name: Compile Elm Application
        run: npm run build

      - name: Test Graph Generation
        run: node Code/backend/build_graph.js
