name: Feature Request
description: Propose a new capability, user interface enhancement, or navigation improvement for KrokenKompass.
title: "Feature: "
labels: ["Status: To Do", "Type: Feature"]
assignees: []
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-Submission Checks
      options:
        - label: I have searched existing issues to ensure this feature has not already been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: Describe the user need or navigation scenario that is currently unsupported or difficult to accomplish.
      placeholder: As a student / visitor / maintainer, I want to ... so that ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how the new feature should work from a user or technical perspective.
      placeholder: Explain the desired interaction flow, UI elements, or routing behavior.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      options:
        - High (Core navigation or accessibility capability)
        - Medium (Workflow, search, or usability improvement)
        - Low (Minor convenience or cosmetic enhancement)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Project Area(s)
      description: If known, select the project area(s) involved in this feature.
      multiple: true
      options:
        - Frontend UI & Design System (index.html, Code/frontend/cssFiles/style.css)
        - Elm Application State, Search & URL Routing (Code/frontend/src/Main.elm, GraphData.elm)
        - Routing Algorithm & Edge Weighting (Code/frontend/src/Dijkstra.elm, Code/backend/build_graph.js)
        - Interactive Map & Leaflet Overlays (Code/frontend/map-view.js)
        - Additional Campus Buildings, Rooms, or Landmarks (Data/vsp_etage_*.json, Data/vsp_units.json)
        - Build Pipeline, CI/CD, or Documentation
        - Other / Not Sure

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: List concrete conditions that should be satisfied for this feature to be considered complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2

  - type: textarea
    id: context
    attributes:
      label: Additional Context, Mockups, or References
      description: Attach wireframes, screenshots, architectural notes, or links to related examples.
